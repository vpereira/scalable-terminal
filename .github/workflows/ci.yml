name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # macOS because that is the only platform the app runs on: `sc` signs through
    # the Secure Enclave. The tests themselves are pure, but matching the target
    # platform means CI exercises the same toolchain and linker as development.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Scoped to our own crate rather than a global RUSTFLAGS, which would also
      # deny warnings inside dependencies and fail on code we do not control.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release
